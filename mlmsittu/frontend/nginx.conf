# ==============================================================================================
# MLM Sittu — frontend and API gateway
#
# This reproduces the Vite dev proxy in production, and that is the point rather than a
# convenience. The browser sees one origin, so the session cookie is first-party, SameSite=Lax
# behaves as intended, and there is no CORS configuration anywhere in the project.
#
# Serving the frontend from a different origin would force SameSite=None, which requires Secure,
# which requires getting cookie policy right across two hosts. One origin avoids all of it.
# ==============================================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Documents are images and PDFs up to 10 MB, and nginx's 1 MB default would reject them with a
    # 413 that never reaches the application's own error handling.
    client_max_body_size 12m;

    # Uploads and reports can be slow; the default 60s read timeout cuts a large CSV export off
    # mid-stream.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- the API
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        # The application runs with server.forward-headers-strategy=framework and reads these.
        # Without them every request looks like plain http from the proxy's own address, which
        # breaks absolute URLs and collapses every client into one rate-limit bucket.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Buffering off for downloads: a document or a CSV should stream to the browser rather
        # than being assembled in nginx first.
        proxy_buffering off;
    }

    # The health endpoint, for a load balancer or an uptime check. Deliberately the only actuator
    # path exposed — the application exposes just `health`, and this keeps it that way even if
    # that changes.
    location = /actuator/health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------------------------------------------------------------- the application shell
    #
    # Hashed filenames, so these can be cached hard and forever. A new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the hashed assets, and a stale copy
    # sends returning users to files that no longer exist. That failure looks like a blank page
    # and survives a refresh, which makes it unusually hard to diagnose from a bug report.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Client-side routing: every unknown path is a React route, not a missing file.
    #
    # Below the /api/ block on purpose — an unmatched API path must return the application's own
    # 404 rather than silently serving the HTML shell, which would reach the frontend as a JSON
    # parse error and send whoever is debugging it in entirely the wrong direction.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here should be indexed or framed.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
