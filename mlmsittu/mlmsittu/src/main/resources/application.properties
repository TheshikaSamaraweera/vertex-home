spring.application.name=mlmsittu

# Blocking MVC on virtual threads (architecture 1.4). Gives the I/O scalability of a reactive
# stack while keeping @Transactional semantics and the pessimistic locking Phase 3 depends on.
spring.threads.virtual.enabled=true


# --- Database: runtime connection -------------------------------------------------------------
# Deliberately NOT the postgres superuser. This role has no DDL rights and no UPDATE or DELETE on
# audit_log, which is what makes the audit trail append-only in fact rather than by convention.
# Create it once with: db/bootstrap/01-app-role.sql
spring.datasource.url=jdbc:postgresql://localhost:5432/mlmsitty
spring.datasource.username=mlmsittu_app
spring.datasource.password=mlmsittu_app
spring.datasource.driver-class-name=org.postgresql.Driver


# --- Flyway: migration connection -------------------------------------------------------------
# Migrations run as the owner because they create tables, extensions and partitions.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/mlmsitty
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.locations=classpath:db/migration
# Forward-only, expand/contract. Never "fix" a migration that has already run anywhere.
spring.flyway.validate-on-migrate=true


# --- Read replica (P7-07) ---------------------------------------------------------------------
# Commented out on purpose. Without spring.datasource.replica.url there is one database and no
# routing at all; set it and read-only transactions start using the replica, with no code change.
#
# Stock availability stays on the primary regardless — see @ReadFromPrimary. Replication lag on
# that particular question is how the same units get promised to two customers.
#
#spring.datasource.replica.url=jdbc:postgresql://replica-host:5432/mlmsitty
#spring.datasource.replica.username=mlmsittu_app
#spring.datasource.replica.password=mlmsittu_app


# --- JPA / Hibernate --------------------------------------------------------------------------
# Schema is owned by Flyway. validate catches entity/schema drift at startup instead of at 2am.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Off on purpose: open-in-view hides lazy loading inside view rendering and makes query counts
# unpredictable. Anything the response needs must be fetched in the service layer.
spring.jpa.open-in-view=false


# --- Session ----------------------------------------------------------------------------------
# Stored in PostgreSQL (P7-01). Sessions now survive a restart and are shared between instances,
# which is what makes running more than one possible at all.
#
# Schema is owned by Flyway (V20), never created by Spring — an application that creates its own
# tables at startup behaves differently on a database it cannot alter.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
# How often expired rows are swept. Sessions expire on read regardless; this only reclaims space.
spring.session.jdbc.cleanup-cron=0 */10 * * * *
server.servlet.session.cookie.name=MLMSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# MUST become true in staging and production. It is false here only because local dev is http.
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m


# --- Security tuning --------------------------------------------------------------------------
# Enforced across every instance (P7-05), because the counter lives in the database.
security.rate-limit.login.max-attempts=10
security.rate-limit.login.window-minutes=15
security.totp.issuer=MLM Sittu


# --- Outbox (P7-06) ---------------------------------------------------------------------------
# Messages are written inside the transaction that causes them and delivered afterwards, so a
# rollback cannot leave a sent email behind. Safe on several instances at once: the poller claims
# rows with FOR UPDATE SKIP LOCKED.
outbox.poll-interval-ms=5000
outbox.batch-size=25


# --- Errors ---------------------------------------------------------------------------------
# Belt and braces alongside GlobalExceptionHandler: even a failure that bypasses the advice must
# not return a stack trace or an exception message.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false


# --- Actuator -------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# --- Outbound mail --------------------------------------------------------------------------
# Commented out on purpose. With no spring.mail.host, SmtpEmailTransport is not registered and
# every message goes to the application log instead — which is what you want locally.
#
# Messages are never sent inline. They are written to outbox_message inside the transaction that
# caused them and delivered a few seconds later by OutboxDispatcher, so a rollback cannot leave a
# sent email behind and a dead mail server cannot fail a purchase order.
#
# NEVER commit a real password here. Use an app-specific password and an environment variable.
#
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=orders@yourcompany.lk
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
# Who the recipient sees it from. Defaults to spring.mail.username.
#notifications.mail.from=orders@yourcompany.lk
#
# To watch it work without a real provider, run a throwaway SMTP server on 1025 and start with:
#   SPRING_MAIL_HOST=127.0.0.1 SPRING_MAIL_PORT=1025 #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=false #   SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=false
# Anything already queued in outbox_message is delivered on the next poll, so messages logged
# while no transport was configured are not lost — they were waiting.


# --- Server ---------------------------------------------------------------------------------
server.port=8080

# --- Registering people who have no e-mail ------------------------------------------------------
# Many customers have no e-mail address at all, and an administrator registers them at the desk.
#
# When the administrator enters THIS address, the account is created with a generated sub-address
# of it instead - office+K7M2@gmail.com rather than office@gmail.com. Every one of those is
# delivered to this same real mailbox, so the office receives all of it, while each account keeps
# the unique address that login, the unique index on app_user.email, and the audit trail need.
#
# Only this address is treated that way. Any other duplicate still conflicts, because a real
# duplicate is usually a mistake worth catching.
#
# Leave it empty to switch the behaviour off entirely.
onboarding.shared-inbox=solutions.vertexhome@gmail.com
