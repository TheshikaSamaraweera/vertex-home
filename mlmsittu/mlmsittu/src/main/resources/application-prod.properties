# ==============================================================================================
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
#
# Everything secret comes from the environment. Nothing in this file is a credential, and nothing
# in this file should ever become one: the image is built once and run in several places, so a
# password baked in here would be a password in every one of them and in the registry besides.
#
# The defaults in application.properties are tuned for a laptop. This file overrides only what is
# actually wrong in production, and deliberately leaves the rest alone so there is one place to
# look for each setting rather than two.
# ==============================================================================================


# --- Database ---------------------------------------------------------------------------------
# No defaults. An unset variable must fail at startup with a clear message rather than quietly
# connecting to something that happens to exist.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway connects as the owner because it creates tables; the application connects as a weaker
# role with no DDL rights and no UPDATE or DELETE on audit_log. That split is what makes the audit
# trail append-only in fact rather than by convention, and it survives containerisation only if
# these stay two different accounts.
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}

# The pool is sized for the container's memory, not the laptop's.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}


# --- Session cookie ---------------------------------------------------------------------------
# Secure is the whole reason this file overrides it: the development value is false because local
# development is http, and shipping that to a site behind TLS sends the session cookie over any
# plaintext request that reaches the box.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax


# --- Behind a proxy ---------------------------------------------------------------------------
# nginx terminates TLS and forwards X-Forwarded-*. Without this the application believes every
# request arrived over http on port 8080, which breaks absolute URLs and — because the container
# only ever sees the proxy — makes every rate limit share one client address.
server.forward-headers-strategy=framework


# --- API documentation ------------------------------------------------------------------------
# The application warns about these at startup on purpose. /v3/api-docs describes every endpoint
# and every DTO, which is a map for anybody probing the site; the frontend types are generated at
# build time and do not need it at runtime.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false


# --- Documents --------------------------------------------------------------------------------
# A path inside the container is a path that disappears on the next deploy, taking every uploaded
# NIC and bank slip with it. This must be a mounted volume.
storage.filesystem.root=${DOCUMENT_ROOT:/var/mlmsittu/documents}


# --- Errors -----------------------------------------------------------------------------------
# Already the default; restated because getting it wrong leaks stack traces to the public.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false


# --- Logging ----------------------------------------------------------------------------------
# Quieter than development, and to stdout so the container runtime collects it.
logging.level.root=INFO
logging.level.com.democode.mlmsittu=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false


# --- Scheduled work ---------------------------------------------------------------------------
# Architecture §10.1 wants scheduled jobs on one instance so they do not fire once per replica.
# With a single container this is correct as-is; running a second container means setting
# JOBS_SCHEDULER_ENABLED=false on all but one of them.
jobs.scheduler.enabled=${JOBS_SCHEDULER_ENABLED:true}

# --- Health ---------------------------------------------------------------------------------
# The container's HEALTHCHECK curls /actuator/health, so anything that reports DOWN there marks
# the container unhealthy. Mail must not be able to do that.
#
# With a real SMTP server configured, the mail health indicator opens a connection to it on every
# probe — so a slow or briefly unavailable provider (an SES blip, a rate limit) would make a
# perfectly healthy application look broken, and would fail the smoke test in DEPLOYMENT.md.
# Undelivered mail is already handled properly: it stays in outbox_message and is retried.
management.health.mail.enabled=false
