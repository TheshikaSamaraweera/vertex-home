# ==============================================================================================
# Local Docker profile — activate with SPRING_PROFILES_ACTIVE=local
#
# The whole stack in containers on a developer machine. This is NOT the prod profile and must
# never be used on a server: it keeps the laptop's cookie settings, the laptop's NIC development
# secrets, and an open API-docs endpoint.
#
# Why a separate profile rather than `prod` with a few overrides:
#
#   1. Under `prod` the session cookie is Secure, so over plain http://localhost the browser
#      refuses to store it and nobody can log in. That guard is correct and should stay.
#   2. Under `prod` the application refuses to start while the NIC pepper and encryption key are
#      the development values — and locally they have to BE the development values, or the NIC
#      data already in your database stops decrypting and every nic_hash stops matching.
#
# Only the database location differs from a native local run. Everything else is inherited from
# application.properties on purpose, so there is one place to look for each setting.
# ==============================================================================================


# --- Database -----------------------------------------------------------------------------------
# `db` is the compose service name, resolved on the compose network. The defaults let this profile
# also run from an IDE against a containerised database on the published port.
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/mlmsitty}
spring.datasource.username=${DB_USER:mlmsittu_app}
spring.datasource.password=${DB_PASSWORD:mlmsittu_app}

# Flyway still connects as the owner and the application as the weaker role, exactly as in
# production. Collapsing them to one account locally would mean the append-only audit guarantee is
# never exercised until the day it matters.
spring.flyway.url=${DB_URL:jdbc:postgresql://db:5432/mlmsitty}
spring.flyway.user=${DB_MIGRATION_USER:postgres}
spring.flyway.password=${DB_MIGRATION_PASSWORD:postgres}

# A laptop running three containers has less to spare than an EC2 instance running the same three.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}


# --- Behind nginx -------------------------------------------------------------------------------
# The web container proxies to this one, so the application never sees the browser's address
# directly. Without this every rate limit would share nginx's address and one user tripping the
# login limiter would lock out everybody.
server.forward-headers-strategy=framework


# --- Documents ----------------------------------------------------------------------------------
# A named volume, so uploads survive `docker compose up --build`.
storage.filesystem.root=${DOCUMENT_ROOT:/var/mlmsittu/documents}


# --- API documentation --------------------------------------------------------------------------
# Left on, unlike production: `npm run api:sync` reads /v3/api-docs to regenerate the frontend
# types, and turning it off here would break that against a containerised backend.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# --- Logging ------------------------------------------------------------------------------------
# To stdout, where `docker compose logs -f app` will find it.
logging.level.root=INFO
logging.level.com.democode.mlmsittu=DEBUG
spring.jpa.show-sql=false

jobs.scheduler.enabled=${JOBS_SCHEDULER_ENABLED:true}

# --- Health ---------------------------------------------------------------------------------
# The container's HEALTHCHECK curls /actuator/health, and a DOWN there marks the container
# unhealthy — which stops anything that waits on it. Mail is optional in this profile, so a
# missing or unreachable SMTP server must not be able to do that. It would also mean every health
# probe opens a connection to your mail provider, which is a slow way to fail.
management.health.mail.enabled=false
