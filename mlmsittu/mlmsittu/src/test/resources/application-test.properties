# Tests run against their own database, never against development data.
#
# The Phase 3 concurrency tests exhaust stock on purpose and repeat a hundred times; running them
# against mlmsitty would wipe the seed data on every build. Create the database once with
# db/bootstrap/02-test-database.sql — Flyway migrates it automatically from there.

spring.datasource.url=jdbc:postgresql://localhost:5432/mlmsitty_test
spring.datasource.username=mlmsittu_app
spring.datasource.password=mlmsittu_app

spring.flyway.url=jdbc:postgresql://localhost:5432/mlmsitty_test
spring.flyway.user=postgres
spring.flyway.password=postgres

# Scheduled jobs would fire mid-test and mutate the fixtures underneath an assertion.
jobs.scheduler.enabled=false

# Concurrency tests produce expected rollbacks and lock waits; the stack traces are noise.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
logging.level.org.springframework.orm.jpa.JpaTransactionManager=WARN
